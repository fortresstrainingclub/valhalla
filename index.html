<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valhalla">
<meta name="mobile-web-app-capable" content="yes">
<title>VALHALLA — Programación Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Firebase SDKs (compat version for vanilla HTML) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<!-- PDF generation libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-elev-2: #1a1a1a;
    --bg-card: #1f1f1f;
    --line: #2a2a2a;
    --line-strong: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #999;
    --text-faint: #666;
    --red: #e10600;
    --red-bright: #ff1a1a;
    --red-dark: #a50400;
    --red-glow: rgba(225, 6, 0, 0.15);
    --warmup: #4a90e2;
    --strength: #f5a623;
    --wod: var(--red);
    --acc: #7ed321;
    --cooldown: #9b9b9b;
    --notes: #b8b8b8;
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    background-image:
      radial-gradient(at 0% 0%, rgba(225,6,0,0.04) 0%, transparent 50%),
      radial-gradient(at 100% 100%, rgba(225,6,0,0.03) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ========== LOGIN SCREEN ========== */
  .login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    background-image:
      radial-gradient(at 50% 30%, rgba(225,6,0,0.18) 0%, transparent 55%),
      radial-gradient(at 20% 80%, rgba(225,6,0,0.08) 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 24px;
  }
  .login-box {
    width: 100%;
    max-width: 380px;
    background: rgba(20,20,20,0.85);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    padding: 36px 32px 28px;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .login-logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 14px;
    display: block;
  }
  .login-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 0.18em;
    color: var(--text);
    margin-bottom: 4px;
  }
  .login-title span { color: var(--red); }
  .login-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 28px;
  }
  .login-field { margin-bottom: 12px; text-align: left; }
  .login-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 5px;
  }
  .login-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 13px;
    font-size: 14px;
    border-radius: 6px;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s;
  }
  .login-field input:focus { border-color: var(--red); }
  .login-error {
    color: var(--red-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    min-height: 14px;
    text-align: center;
  }
  .login-btn {
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    padding: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.16em;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 8px;
  }
  .login-btn:hover { background: var(--red-bright); transform: translateY(-1px); }
  .login-foot {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .app { display: none; }
  .app.authed { display: block; }

  /* ========== HEADER ========== */
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 42px; height: 42px; flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1; }
  .brand-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.12em;
    color: var(--text);
  }
  .brand-name span { color: var(--red); }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-top: 3px;
  }

  .header-center {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
  }
  .week-nav-btn {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .week-nav-btn:hover { border-color: var(--red); color: var(--red); }
  .week-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 240px;
    padding: 4px 14px;
  }
  .week-display .week-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .week-display .week-num span { color: var(--red); }
  .week-display .week-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 2px;
  }
  .today-btn {
    background: var(--red);
    color: #fff;
    border: 1px solid var(--red);
    padding: 7px 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 8px;
  }
  .today-btn:hover { background: var(--red-bright); border-color: var(--red-bright); }

  .header-actions { display: flex; gap: 6px; align-items: center; }
  .header-btn {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .header-btn:hover { border-color: var(--text-faint); }
  .header-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .header-btn.primary:hover { background: var(--red-bright); border-color: var(--red-bright); }
  .role-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    padding: 4px 9px;
    border-radius: 3px;
    background: var(--red);
    color: #fff;
  }
  .role-badge.viewer { background: var(--bg-elev-2); color: var(--text-dim); border: 1px solid var(--line); }

  /* Sync status indicator */
  .sync-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 4px 9px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .sync-status::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sync-status.sync-syncing { background: rgba(74,144,226,0.1); color: #4a90e2; }
  .sync-status.sync-syncing::before { background: #4a90e2; animation: pulse 1.4s ease-in-out infinite; }
  .sync-status.sync-saving { background: rgba(245,166,35,0.1); color: #f5a623; }
  .sync-status.sync-saving::before { background: #f5a623; animation: pulse 1s ease-in-out infinite; }
  .sync-status.sync-synced { background: rgba(126,211,33,0.1); color: #7ed321; }
  .sync-status.sync-synced::before { background: #7ed321; }
  .sync-status.sync-offline { background: rgba(155,155,155,0.1); color: #9b9b9b; }
  .sync-status.sync-offline::before { background: #9b9b9b; }
  .sync-status.sync-error { background: rgba(225,6,0,0.1); color: var(--red-bright); }
  .sync-status.sync-error::before { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ========== TRACK BAR ========== */
  .track-bar {
    border-bottom: 1px solid var(--line);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-elev);
    flex-wrap: wrap;
  }
  .track-bar-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  .track-select-wrap { position: relative; }
  .track-select-btn {
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--text);
    padding: 8px 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 200px;
    justify-content: space-between;
    transition: all 0.15s;
  }
  .track-select-btn:hover { border-color: var(--red); }
  .track-select-btn .track-color-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--red);
  }
  .track-select-btn .chev {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
  }

  .track-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 280px;
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    z-index: 90;
    overflow: hidden;
    display: none;
  }
  .track-menu.open { display: block; }
  .track-menu-item {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.1s;
    border-bottom: 1px solid var(--line);
  }
  .track-menu-item:last-of-type { border-bottom: none; }
  .track-menu-item:hover { background: var(--bg-card); }
  .track-menu-item.active {
    background: var(--bg-card);
    box-shadow: inset 3px 0 0 var(--red);
  }
  .track-menu-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--red);
  }
  .track-menu-item .name { flex: 1; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.08em; }
  .track-menu-item .check { color: var(--red); font-size: 14px; }
  .track-menu-item .actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .track-menu-item:hover .actions { opacity: 1; }
  .track-menu-item .mini-btn {
    background: transparent;
    border: none;
    color: var(--text-faint);
    padding: 2px 5px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
  }
  .track-menu-item .mini-btn:hover { background: var(--bg); color: var(--text); }
  .track-menu-item .mini-btn.del:hover { color: var(--red); }

  .track-menu-divider {
    border-top: 1px solid var(--line-strong);
    margin: 0;
  }
  .track-menu-add {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--red);
    padding: 12px 14px;
    text-align: left;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    transition: background 0.1s;
  }
  .track-menu-add:hover { background: rgba(225,6,0,0.08); }

  .track-color-pick {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .track-color-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.1s;
  }
  .track-color-swatch.selected { border-color: var(--text); transform: scale(1.1); }

  .track-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-left: auto;
  }
  .track-info b { color: var(--text); font-weight: 700; }

  /* ========== CALENDAR GRID ========== */
  .calendar {
    padding: 16px 16px 60px;
    max-width: 100%;
    overflow: visible;
  }

  .week-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 8px 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .week-title-row .ed-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.04em;
    background: transparent;
    border: none;
    color: var(--text);
    outline: none;
    flex: 1;
    min-width: 200px;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .week-title-row .ed-title:focus { background: var(--bg-elev); }
  .week-title-row .ed-title:read-only { cursor: default; }
  .week-title-row .ed-title:read-only:focus { background: transparent; }
  .week-stats {
    display: flex;
    gap: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .week-stats b { color: var(--red); font-weight: 700; font-size: 13px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
    align-items: start;
    width: 100%;
    max-width: 100%;
  }

  .day-col {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: visible;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s;
  }
  .day-col:hover { border-color: var(--line-strong); }
  .day-col.is-today { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 24px var(--red-glow); }
  .day-col.is-rest { background: linear-gradient(180deg, var(--bg-elev) 0%, rgba(255,255,255,0.02) 100%); }

  .day-head {
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev-2);
    border-radius: 8px 8px 0 0;
    position: sticky;
    top: 70px;
    z-index: 10;
  }
  .day-col.is-today .day-head { background: linear-gradient(180deg, rgba(225,6,0,0.18), var(--bg-elev-2)); }
  .day-head-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .day-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  .day-col.is-today .day-name { color: var(--red); }
  .day-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 700;
  }
  .day-focus-input {
    background: transparent;
    border: 1px dashed transparent;
    color: var(--text-dim);
    font-size: 11px;
    width: 100%;
    padding: 3px 4px;
    margin-top: 4px;
    border-radius: 3px;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .day-focus-input::placeholder { color: var(--text-faint); font-style: italic; }
  .day-focus-input:not(:read-only):hover { border-color: var(--line); }
  .day-focus-input:not(:read-only):focus { background: var(--bg); border-color: var(--red); border-style: solid; color: var(--text); }

  .day-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    gap: 6px;
  }
  .rest-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    user-select: none;
  }
  .rest-toggle input { accent-color: var(--red); width: 12px; height: 12px; }
  .day-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
  }

  .day-body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .day-col.is-rest .day-body { opacity: 0.55; }

  .rest-banner {
    text-align: center;
    padding: 32px 12px;
    color: var(--text-dim);
  }
  .rest-banner .display {
    font-size: 32px;
    color: var(--text);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .rest-banner small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  /* ========== BLOCK CARDS (preview only — click opens modal) ========== */
  .block {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--text-faint);
    border-radius: 5px;
    overflow: hidden;
    transition: all 0.15s;
    cursor: pointer;
  }
  .block:hover {
    border-color: var(--line-strong);
    background: var(--bg-elev-2);
    transform: translateX(1px);
  }
  .block.b-warmup { border-left-color: var(--warmup); }
  .block.b-strength { border-left-color: var(--strength); }
  .block.b-wod { border-left-color: var(--wod); }
  .block.b-acc { border-left-color: var(--acc); }
  .block.b-cooldown { border-left-color: var(--cooldown); }
  .block.b-notes { border-left-color: var(--notes); }

  .block-preview {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .block-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .block-tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .block-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .b-warmup .block-tag { color: var(--warmup); }
  .b-warmup .block-tag::before { background: var(--warmup); }
  .b-strength .block-tag { color: var(--strength); }
  .b-strength .block-tag::before { background: var(--strength); }
  .b-wod .block-tag { color: var(--red); }
  .b-wod .block-tag::before { background: var(--red); }
  .b-acc .block-tag { color: var(--acc); }
  .b-acc .block-tag::before { background: var(--acc); }
  .b-cooldown .block-tag { color: var(--cooldown); }
  .b-cooldown .block-tag::before { background: var(--cooldown); }
  .b-notes .block-tag { color: var(--notes); }
  .b-notes .block-tag::before { background: var(--notes); }

  .block-chevron {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    transition: color 0.15s;
  }
  .block:hover .block-chevron { color: var(--red); }

  .block-preview-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--text);
    line-height: 1.2;
  }
  .block-preview-snippet {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    margin-top: 2px;
  }
  .block-wod-meta {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .block-wod-pill {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 1px 6px;
    border-radius: 2px;
    background: var(--red);
    color: #fff;
  }
  .block-wod-pill.cap {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0;
  }
  .block-video-indicator {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--warmup);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* ========== ADD BLOCK ========== */
  .add-block-wrap { position: relative; margin-top: 4px; }
  .add-block-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line-strong);
    color: var(--text-dim);
    padding: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .add-block-btn:hover { border-color: var(--red); color: var(--red); background: rgba(225,6,0,0.04); }

  .add-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    z-index: 95;
    overflow: hidden;
    display: none;
  }
  .add-menu.open { display: block; }
  .add-menu-item {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 9px 12px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }
  .add-menu-item:hover { background: var(--bg-card); }
  .add-menu-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ========== MODAL (block detail — BIG) ========== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(8px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 200;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .modal-bg.open { display: flex; }

  /* Block detail modal — large, scrollable */
  .modal-detail {
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    width: 100%;
    max-width: 720px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    border-left: 5px solid var(--text-faint);
    margin: auto;
  }
  .modal-detail.b-warmup { border-left-color: var(--warmup); }
  .modal-detail.b-strength { border-left-color: var(--strength); }
  .modal-detail.b-wod { border-left-color: var(--red); }
  .modal-detail.b-acc { border-left-color: var(--acc); }
  .modal-detail.b-cooldown { border-left-color: var(--cooldown); }
  .modal-detail.b-notes { border-left-color: var(--notes); }

  .modal-detail-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .modal-detail-tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.18em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .modal-detail-tag::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .modal-detail.b-warmup .modal-detail-tag { color: var(--warmup); }
  .modal-detail.b-warmup .modal-detail-tag::before { background: var(--warmup); }
  .modal-detail.b-strength .modal-detail-tag { color: var(--strength); }
  .modal-detail.b-strength .modal-detail-tag::before { background: var(--strength); }
  .modal-detail.b-wod .modal-detail-tag { color: var(--red); }
  .modal-detail.b-wod .modal-detail-tag::before { background: var(--red); }
  .modal-detail.b-acc .modal-detail-tag { color: var(--acc); }
  .modal-detail.b-acc .modal-detail-tag::before { background: var(--acc); }
  .modal-detail.b-cooldown .modal-detail-tag { color: var(--cooldown); }
  .modal-detail.b-cooldown .modal-detail-tag::before { background: var(--cooldown); }
  .modal-detail.b-notes .modal-detail-tag { color: var(--notes); }
  .modal-detail.b-notes .modal-detail-tag::before { background: var(--notes); }

  .modal-detail-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .modal-detail-actions { display: flex; gap: 6px; }
  .modal-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }

  .modal-detail-body {
    padding: 24px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }

  .field-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-bottom: 8px;
  }
  .field-group { margin-bottom: 18px; }
  .field-group:last-child { margin-bottom: 0; }

  .modal-title-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal-title-input:not(:read-only):focus { border-color: var(--red); }
  .modal-title-input::placeholder { color: var(--text-faint); }
  .modal-title-input:read-only { cursor: default; }

  /* WOD: format / cap / score row in modal */
  .modal-wod-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .modal-wod-row label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 4px;
  }
  .modal-wod-row select, .modal-wod-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border-radius: 5px;
    outline: none;
  }
  .modal-wod-row select { cursor: pointer; }
  .modal-wod-row select:not(:disabled):focus, .modal-wod-row input:not(:read-only):focus { border-color: var(--red); }

  .modal-body-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 14px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 1.7;
    border-radius: 6px;
    outline: none;
    resize: vertical;
    min-height: 240px;
    white-space: pre-wrap;
    transition: border-color 0.15s;
  }
  .modal-body-textarea:not(:read-only):focus { border-color: var(--strength); }
  .modal-body-textarea::placeholder { color: var(--text-faint); white-space: pre-wrap; line-height: 1.7; }
  .b-warmup .modal-body-textarea:not(:read-only):focus { border-color: var(--warmup); }
  .b-wod .modal-body-textarea:not(:read-only):focus { border-color: var(--red); }
  .b-acc .modal-body-textarea:not(:read-only):focus { border-color: var(--acc); }
  .b-cooldown .modal-body-textarea:not(:read-only):focus { border-color: var(--cooldown); }
  .b-notes .modal-body-textarea:not(:read-only):focus { border-color: var(--notes); }

  /* Read-only display version - more legible, no input look */
  .modal-body-display {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 14px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 1.7;
    border-radius: 6px;
    color: var(--text);
    white-space: pre-wrap;
    min-height: 80px;
  }
  .modal-body-display.empty { color: var(--text-faint); font-style: italic; }
  .modal-title-display {
    background: transparent;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    padding: 10px 14px;
    color: var(--text);
  }
  .modal-title-display.empty { color: var(--text-faint); font-style: italic; font-family: 'Inter', sans-serif; font-size: 14px; letter-spacing: 0; }

  .modal-stimulus-input {
    width: 100%;
    background: rgba(225,6,0,0.05);
    border: 1px solid rgba(225,6,0,0.25);
    color: var(--text);
    padding: 10px 14px;
    font-size: 13px;
    border-radius: 5px;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-style: italic;
  }
  .modal-stimulus-input::placeholder { color: var(--text-faint); }
  .modal-stimulus-input:not(:read-only):focus { border-color: var(--red); background: rgba(225,6,0,0.08); }

  .modal-video-row {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .modal-video-row .vid-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .modal-video-row .vid-info a {
    color: var(--warmup);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .modal-video-row .vid-info a:hover { text-decoration: underline; }
  .modal-video-row .vid-info .empty {
    color: var(--text-faint);
    font-style: italic;
    font-size: 12px;
  }

  .modal-detail-foot {
    padding: 14px 24px;
    border-top: 1px solid var(--line);
    background: var(--bg-elev-2);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .danger-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 8px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .danger-btn:hover { border-color: var(--red); color: var(--red); background: rgba(225,6,0,0.06); }

  /* Video edit modal (smaller) */
  .modal-small {
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    width: 100%;
    max-width: 460px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    margin: auto;
  }
  .modal-small-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-small-head h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.08em;
  }
  .modal-small-body { padding: 18px; }
  .modal-small-body label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 5px;
  }
  .modal-small-body input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    border-radius: 5px;
    outline: none;
    margin-bottom: 12px;
    font-family: 'Inter', sans-serif;
  }
  .modal-small-body input:focus { border-color: var(--red); }
  .modal-small-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--red);
    padding: 11px 16px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text);
    box-shadow: var(--shadow-md);
    z-index: 300;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  /* Read-only mode visual cues */
  .role-viewer .add-block-btn,
  .role-viewer .add-block-wrap { display: none !important; }
  .role-viewer .rest-toggle { display: none; }
  .role-viewer .danger-btn { display: none !important; }

  @media (max-width: 1100px) and (min-width: 769px) {
    .grid {
      grid-template-columns: repeat(7, minmax(170px, 1fr));
      overflow-x: auto;
      padding-bottom: 12px;
    }
    .day-head { position: static; top: auto; }
  }

  /* ==========================================================
     MOBILE (≤768px) — vista de un día por vez con swipe
     ========================================================== */
  /* ==========================================================
     MOBILE (≤768px) — vista de un día por vez con swipe
     Optimizado para que profes lo usen en el celu en el gym
     ========================================================== */
  @media (max-width: 768px) {
    body {
      font-size: 15px;
      /* Safe areas para iOS notch / Android nav bar */
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ===== HEADER COMPACTO ===== */
    header {
      padding: 8px 10px;
      gap: 6px;
      flex-wrap: nowrap;
      min-height: 52px;
    }
    .brand {
      gap: 0;
      flex-shrink: 0;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
    }
    .brand-text { display: none; }

    .header-center { display: none; }

    .header-actions {
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }

    /* Role badge: solo dot de color, sin texto */
    .role-badge {
      font-size: 0;
      padding: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
    }
    .role-badge.viewer {
      background: var(--text-dim);
      border: none;
    }

    /* Sync status: solo dot animado */
    .sync-status {
      font-size: 0;
      padding: 0;
      gap: 0;
      background: transparent !important;
    }
    .sync-status::before {
      width: 9px;
      height: 9px;
      margin: 0;
    }

    /* Botones del header: solo íconos en mobile */
    .header-btn {
      padding: 9px 11px;
      font-size: 14px;
      min-height: 38px;
      min-width: 38px;
      justify-content: center;
    }
    .header-btn span.btn-text-mobile-hide { display: none; }
    /* Hide PDF button text on extra small screens, keep emoji */
    #pdfBtn {
      padding: 9px 10px;
      min-width: 38px;
    }

    /* ===== TRACK BAR ===== */
    .track-bar {
      padding: 8px 10px;
      gap: 8px;
      flex-wrap: nowrap;
      min-height: 50px;
    }
    .track-bar-label { display: none; }
    .track-select-wrap { flex: 1; min-width: 0; }
    .track-select-btn {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      font-size: 13px;
      min-height: 42px;
    }
    .track-select-btn span:nth-child(2) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: left;
    }
    .track-menu {
      left: 0;
      right: 0;
      min-width: 0;
      max-height: 70vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .track-menu-item {
      padding: 12px 14px;
      min-height: 52px;
      gap: 12px;
    }
    /* En mobile mostramos siempre los botones de acción (no hay hover) */
    .track-menu-item .actions {
      opacity: 1 !important;
      gap: 2px;
    }
    .track-menu-item .mini-btn {
      width: 36px;
      height: 36px;
      min-width: 36px;
      padding: 0;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
    }
    .track-menu-item .dot {
      width: 10px;
      height: 10px;
    }
    .track-menu-item .name {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .track-menu-item .check {
      font-size: 16px;
      flex-shrink: 0;
    }
    .track-info { display: none; }

    /* ===== MOBILE WEEK NAV ===== */
    .mobile-week-nav {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-elev);
      position: sticky;
      top: calc(52px + env(safe-area-inset-top, 0));
      z-index: 90;
      min-height: 56px;
    }
    .mobile-week-nav .nav-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      gap: 2px;
    }
    .mobile-week-nav .nav-info .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 0.06em;
      color: var(--text);
    }
    .mobile-week-nav .nav-info .num span { color: var(--red); }
    .mobile-week-nav .nav-info .range {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .mobile-week-nav .week-nav-btn {
      width: 44px;
      height: 44px;
      font-size: 18px;
    }
    .mobile-week-nav .today-btn {
      padding: 10px 14px;
      font-size: 12px;
      min-height: 44px;
      margin-left: 0;
    }

    /* ===== CALENDAR ===== */
    .calendar { padding: 0 0 32px; }

    .week-title-row {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding: 12px 14px 10px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--line);
    }
    .week-title-row .ed-title {
      font-size: 18px;
      letter-spacing: 0.04em;
      padding: 4px 0;
      flex: none;
      text-align: left;

    .week-title-row .ed-title:read-only:placeholder-shown {
      display: none;
    }
    .week-stats {
      gap: 14px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .week-stats b { font-size: 12px; }

    /* ===== DAY TABS ===== */
    .day-tabs {
      display: flex !important;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);

async function doLogin(e) {
  if (e) e.preventDefault();
  const emailInput = document.getElementById('loginUser').value.trim().toLowerCase();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const loginBtn = document.querySelector('.login-btn');

  // Allow user to type just "admin" or "profes" instead of full email
  let email = emailInput;
  if (!email.includes('@')) {
    email = email + '@valhalla.com';
  }

  if (!password) {
    errEl.textContent = 'Ingresá tu contraseña';
    return false;
  }

  errEl.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'INGRESANDO...';

  try {
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged se encarga del resto
  } catch (err) {
    let msg = 'Error al ingresar';
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      msg = 'Usuario o contraseña incorrectos';
    } else if (err.code === 'auth/network-request-failed') {
      msg = 'Sin conexión a internet';
    } else if (err.code === 'auth/too-many-requests') {
      msg = 'Demasiados intentos. Esperá unos minutos.';
    } else if (err.code === 'auth/invalid-email') {
      msg = 'Email inválido';
    }
    errEl.textContent = msg;
    document.getElementById('loginPass').value = '';
    setTimeout(() => { errEl.textContent = ''; }, 4000);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'INGRESAR';
  }
  return false;
}

async function doLogout() {
  try {
    await auth.signOut();
  } catch (e) { console.warn('Logout error:', e); }
  // onAuthStateChanged maneja el reset de UI
}

/* ============================================================
   DATE UTILS
   ============================================================ */
function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function isoKey(d) { return d.toISOString().slice(0,10); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDay(d) { return d.getDate().toString().padStart(2,'0'); }
function fmtMonShort(d) { return d.toLocaleDateString('es-AR', { month: 'short' }).toUpperCase().replace('.',''); }
function isSameDate(a,b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart)/86400000) + 1)/7);
}

/* ============================================================

function emptyDay() { return { rest: false, focus: '', blocks: [] }; }
function emptyWeek() {
  const w = { title: '', days: {} };
  DAYS.forEach(d => w.days[d.code] = emptyDay());
  return w;
}
function emptyTrack(name, color) {
  return {
    id: 't' + Date.now() + Math.random().toString(36).slice(2,6),
    name: name || 'Track sin nombre',
    color: color || TRACK_COLORS[0],
    weeks: {}
  };
}
function getCurrentTrack() {
  if (!appData.currentTrackId || !appData.tracks[appData.currentTrackId]) {
    // pick first available
    const ids = Object.keys(appData.tracks);
    if (ids.length) appData.currentTrackId = ids[0];
    else return null;
  }
  return appData.tracks[appData.currentTrackId];
}
function getWeek() {
  const track = getCurrentTrack();
  if (!track) return emptyWeek();
  const key = isoKey(currentWeekStart);
  if (!track.weeks[key]) track.weeks[key] = emptyWeek();
  DAYS.forEach(d => { if (!track.weeks[key].days[d.code]) track.weeks[key].days[d.code] = emptyDay(); });
  return track.weeks[key];
}
function newBlock(type) {
  return {
    id: 'b'+Date.now()+Math.random().toString(36).slice(2,6),
    type, title: '', body: '',
    video: '', videoLabel: '',
    format: type === 'wod' ? 'AMRAP' : '',
    timeCap: '', score: '', stimulus: ''
  };
}

function render() {
  const grid = document.getElementById('grid');
  const track = getCurrentTrack();
  const today = new Date();

  const weekNumStr = String(getISOWeek(currentWeekStart)).padStart(2,'0');
  const sun = addDays(currentWeekStart, 6);
  const rangeStr = `${fmtDay(currentWeekStart)} ${fmtMonShort(currentWeekStart)} → ${fmtDay(sun)} ${fmtMonShort(sun)}`;

  document.getElementById('weekNum').textContent = weekNumStr;
  document.getElementById('weekRange').textContent = rangeStr;
  // Mobile mirrors
  const wnm = document.getElementById('weekNumMobile');
  const wrm = document.getElementById('weekRangeMobile');
  if (wnm) wnm.textContent = weekNumStr;
  if (wrm) wrm.textContent = rangeStr;

  if (!track) {
    document.getElementById('weekTitle').value = '';
    document.getElementById('weekTitle').readOnly = true;
    document.getElementById('dayTabs').innerHTML = '';
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; flex: 1; padding: 60px 20px; text-align: center; color: var(--text-dim);">
        <div class="display" style="font-size: 32px; color: var(--text); margin-bottom: 8px;">SIN TRACKS</div>
        <p style="font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em;">
          ${isAdmin() ? 'Creá un track para empezar — botón TRACK arriba' : 'Pedile al admin que cree un track'}
        </p>
      </div>
    `;
    document.getElementById('statSessions').textContent = '0/7';
    document.getElementById('statWods').textContent = '0';
    document.getElementById('statLifts').textContent = '0';
    return;
  }

  const week = getWeek();
  const titleEl = document.getElementById('weekTitle');
  titleEl.value = week.title || '';
  titleEl.readOnly = !isAdmin();

  grid.innerHTML = '';
  let stats = { sessions: 0, wods: 0, lifts: 0 };

  DAYS.forEach((d, idx) => {
    const date = addDays(currentWeekStart, idx);
    const day = week.days[d.code];
    const isToday = isSameDate(date, today);
    if (!day.rest) stats.sessions++;
    day.blocks.forEach(b => {
      if (b.type === 'wod') stats.wods++;
      if (b.type === 'strength') stats.lifts++;
    });

    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' is-today' : '') + (day.rest ? ' is-rest' : '');
    col.dataset.dayCode = d.code;
    col.innerHTML = renderDay(d, day, date);
    grid.appendChild(col);
  });

  document.getElementById('statSessions').textContent = `${stats.sessions}/7`;
  document.getElementById('statWods').textContent = stats.wods;
  document.getElementById('statLifts').textContent = stats.lifts;

  renderDayTabs(week, today);
  // After rendering, scroll to the active day on mobile
  if (window.matchMedia('(max-width: 768px)').matches) {
    scrollToActiveDay(false);
  }
}

let mobileActiveDayIdx = null;

function getMobileActiveDayIdx() {
  if (mobileActiveDayIdx !== null) return mobileActiveDayIdx;
  // Default: today if in current week, else Monday
  const today = new Date();
  for (let i = 0; i < 7; i++) {
    if (isSameDate(addDays(currentWeekStart, i), today)) return i;
  }
  return 0;
}

function renderDayTabs(week, today) {
  const tabsEl = document.getElementById('dayTabs');
  if (!tabsEl) return;
  const activeIdx = getMobileActiveDayIdx();

  tabsEl.innerHTML = DAYS.map((d, i) => {
    const date = addDays(currentWeekStart, i);
    const day = week.days[d.code];
    const isToday = isSameDate(date, today);
    const cls = ['day-tab'];
    if (i === activeIdx) cls.push('active');
    if (isToday) cls.push('is-today');
    if (day.rest) cls.push('has-rest');
    const count = day.rest ? 'REST' : (day.blocks.length ? `${day.blocks.length} bloques` : '—');
    return `
      <button class="${cls.join(' ')}" data-idx="${i}" onclick="goToDay(${i})">
        <span class="tab-name">${d.short}</span>
        <span class="tab-date">${fmtDay(date)}/${String(date.getMonth()+1).padStart(2,'0')}</span>
        <span class="tab-count">${count}</span>
      </button>
    `;
  }).join('');
}

function goToDay(idx) {
  if (idx !== mobileActiveDayIdx) hapticTap();
  mobileActiveDayIdx = idx;
  // Update tab highlights without full re-render
  document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
  const target = document.querySelector(`.day-tab[data-idx="${idx}"]`);
  if (target) target.classList.add('active');
  scrollToActiveDay(true);
}

function scrollToActiveDay(smooth) {
  const grid = document.getElementById('grid');
  const idx = getMobileActiveDayIdx();
  const cols = grid.querySelectorAll('.day-col');
  if (cols[idx]) {
    grid.scrollTo({
      left: cols[idx].offsetLeft,
      behavior: smooth ? 'smooth' : 'auto'
    });
    // Also center the active tab horizontally (sin afectar scroll vertical de la página)
    const tab = document.querySelector(`.day-tab[data-idx="${idx}"]`);
    const tabsEl = document.getElementById('dayTabs');
    if (tab && tabsEl) {
      const tabsRect = tabsEl.getBoundingClientRect();
      const offsetWithinTabs = tab.offsetLeft - tabsEl.offsetLeft;
      const targetScroll = offsetWithinTabs - (tabsRect.width / 2) + (tab.offsetWidth / 2);
      tabsEl.scrollTo({ left: targetScroll, behavior: smooth ? 'smooth' : 'auto' });
    }
  }
}

// Detect swipe to update active tab
let scrollDebounce = null;
function setupGridScrollListener() {
  const grid = document.getElementById('grid');
  if (!grid || grid._scrollHandlerAttached) return;
  grid._scrollHandlerAttached = true;
  grid.addEventListener('scroll', () => {
    if (!window.matchMedia('(max-width: 768px)').matches) return;
    if (scrollDebounce) clearTimeout(scrollDebounce);
    scrollDebounce = setTimeout(() => {
      const cols = grid.querySelectorAll('.day-col');
      const scrollLeft = grid.scrollLeft;
      const colWidth = grid.clientWidth;
      const idx = Math.round(scrollLeft / colWidth);
      if (idx !== mobileActiveDayIdx && idx >= 0 && idx < 7) {
        mobileActiveDayIdx = idx;
        document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
        const target = document.querySelector(`.day-tab[data-idx="${idx}"]`);
        if (target) {
          target.classList.add('active');
          // Centrar el tab horizontalmente dentro del contenedor de tabs,
          // SIN tocar el scroll vertical de la página
          const tabsEl = document.getElementById('dayTabs');
          if (tabsEl) {
            const tabRect = target.getBoundingClientRect();
            const tabsRect = tabsEl.getBoundingClientRect();
            const offsetWithinTabs = target.offsetLeft - tabsEl.offsetLeft;
            const targetScroll = offsetWithinTabs - (tabsRect.width / 2) + (tabRect.width / 2);
            tabsEl.scrollTo({ left: targetScroll, behavior: 'smooth' });
          }
        }
      }
    }, 100);
  });
}

/* Preview card (calendar) — compact, click opens modal */
function renderBlockPreview(dayCode, b) {
  const meta = BLOCK_TYPES[b.type];
  const snippet = b.body ? b.body.split('\n').slice(0, 3).join('\n') : '';

  let preview = '';
  if (b.title) {
    preview += `<div class="block-preview-title">${esc(b.title)}</div>`;
  }
  if (b.type === 'wod') {
    const pills = [];
    if (b.format) pills.push(`<span class="block-wod-pill">${esc(b.format)}</span>`);
    if (b.timeCap) pills.push(`<span class="block-wod-pill cap">${esc(b.timeCap)}</span>`);
    if (pills.length) preview += `<div class="block-wod-meta">${pills.join('')}</div>`;
  }
  if (snippet) {
    preview += `<div class="block-preview-snippet">${esc(snippet)}</div>`;
  } else if (!b.title) {
    preview += `<div class="block-preview-snippet" style="color:var(--text-faint); font-style:italic;">— vacío —</div>`;
  }
  if (b.video) {
    preview += `<div class="block-video-indicator">▶ Video adjunto</div>`;
  }

  return `
    <div class="block ${meta.class}" onclick="openBlockModal('${dayCode}','${b.id}')">
      <div class="block-preview">
        <div class="block-preview-head">
          <span class="block-tag">${meta.tag}</span>
          <span class="block-chevron">▸</span>
        </div>
        ${preview}
      </div>
    </div>
  `;
}

/* ============================================================
   PERSISTENCE (Firestore)
   ============================================================ */
let dataUnsubscribe = null;
let saveTimer = null;
let pendingSave = false;
let firstDataLoad = true;

// Subscribe to real-time updates from Firestore
// Both admin and viewer use the same listener; only admin can write back.
function subscribeToData() {
  if (dataUnsubscribe) dataUnsubscribe();

  setSyncStatus('syncing');

  dataUnsubscribe = DATA_DOC.onSnapshot(
    { includeMetadataChanges: true },
    (snap) => {
      const fromCache = snap.metadata.fromCache;
      const hasPendingWrites = snap.metadata.hasPendingWrites;

      if (snap.exists) {
        const data = snap.data();
        appData = {
          tracks: data.tracks || {},
          currentTrackId: data.currentTrackId || null
        };
      } else {
        appData = { tracks: {}, currentTrackId: null };
      }

      // First load — try migration from legacy localStorage if Firestore is empty
      if (firstDataLoad) {
        firstDataLoad = false;
        if (Object.keys(appData.tracks).length === 0 && isAdmin()) {
          maybeMigrateFromLocalStorage();
        }
        // If still empty and admin, create default track
        if (Object.keys(appData.tracks).length === 0 && isAdmin()) {
          const defaultTrack = emptyTrack('CrossFit General', TRACK_COLORS[0]);
          appData.tracks[defaultTrack.id] = defaultTrack;
          appData.currentTrackId = defaultTrack.id;
          saveToFirestore();
        }
      }

      // If no current track is set, pick the first available
      if (!appData.currentTrackId && Object.keys(appData.tracks).length) {
        appData.currentTrackId = Object.keys(appData.tracks)[0];
      }

      renderTrackBar();
      render();

      // Update sync status
      if (hasPendingWrites) setSyncStatus('saving');
      else if (fromCache) setSyncStatus('offline');
      else setSyncStatus('synced');
    },
    (err) => {
      console.error('Firestore listen error:', err);
      setSyncStatus('error');
      showToast('Error de conexión');
    }
  );
}

// One-time migration from old localStorage data into Firestore (admin only, runs once)
function maybeMigrateFromLocalStorage() {
  try {
    // Check if migration was already done
    if (localStorage.getItem('valhalla-migrated-to-firestore') === '1') return;

    // Try v3 format first (track-aware)
    const v3Raw = localStorage.getItem(LEGACY_KEY_V3);
    if (v3Raw) {
      const parsed = JSON.parse(v3Raw);
      if (parsed && parsed.tracks && Object.keys(parsed.tracks).length > 0) {
        appData = parsed;
        localStorage.setItem('valhalla-migrated-to-firestore', '1');
        showToast('Datos antiguos migrados a la nube');
        saveToFirestore();
        return;
      }
    }

    // Try v2 format (single program, no tracks)
    const v2Raw = localStorage.getItem(LEGACY_KEY_V2);
    if (v2Raw) {
      const legacyWeeks = JSON.parse(v2Raw);
      if (legacyWeeks && Object.keys(legacyWeeks).length > 0) {
        const migrated = emptyTrack('Programación principal', TRACK_COLORS[0]);
        migrated.weeks = legacyWeeks;
        appData = { tracks: { [migrated.id]: migrated }, currentTrackId: migrated.id };
        localStorage.setItem('valhalla-migrated-to-firestore', '1');
        showToast('Datos antiguos migrados a la nube');
        saveToFirestore();
        return;
      }
    }
  } catch (e) {
    console.warn('Migration failed:', e);
  }
}

// Write current appData to Firestore (debounced — auto-saves 1.2s after last edit)
function scheduleFirestoreSave() {
  if (!isAdmin()) return;
  pendingSave = true;
  setSyncStatus('saving');
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveToFirestore();
  }, 1200);
}

async function saveToFirestore() {
  if (!isAdmin()) return;
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  try {
    await DATA_DOC.set({
      tracks: appData.tracks || {},
      currentTrackId: appData.currentTrackId || null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: currentUser
    });
    pendingSave = false;
    // setSyncStatus('synced') will be set by snapshot listener
  } catch (e) {
    console.error('Save failed:', e);
    setSyncStatus('error');
    showToast('Error al guardar');
  }
}

// Manual save button — forces immediate save and gives feedback
async function saveLocal() {

// Sync status indicator
function setSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.className = 'sync-status sync-' + status;
  const labels = {
    'syncing': 'Conectando...',
    'saving':  'Guardando...',
    'synced':  'Sincronizado',
    'offline': 'Sin conexión',
    'error':   'Error de sync'
  };
  el.textContent = labels[status] || '';
}

});

function deleteTrack(trackId) {
  if (!isAdmin()) return;
  const track = appData.tracks[trackId];
  if (!track) return;
  if (Object.keys(appData.tracks).length === 1) {
    showToast('Debe existir al menos un track');
    return;
  }
  if (!confirm(`¿Eliminar el track "${track.name}" y toda su programación? Esta acción no se puede deshacer.`)) return;
  delete appData.tracks[trackId];
  if (appData.currentTrackId === trackId) {
    appData.currentTrackId = Object.keys(appData.tracks)[0];

  scheduleFirestoreSave();
  closeAllMenus();
  renderTrackBar();
  render();
  showToast('Track eliminado');

/* ============================================================

   ============================================================ */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* ============================================================
   PDF EXPORT — genera un PDF visualmente prolijo de la semana
   ============================================================ */
async function exportToPDF() {
  const track = getCurrentTrack();
  if (!track) { showToast('No hay track seleccionado'); return; }

  const week = getWeek();
  const hasContent = Object.values(week.days).some(d => d.blocks && d.blocks.length > 0);
  if (!hasContent) {
    showToast('No hay contenido para exportar');
    return;
  }

  // Verify libs are loaded
  if (typeof window.jspdf === 'undefined') {
    showToast('PDF no disponible — recargá la página');
    return;
  }

  showToast('Generando PDF...');
  const btn = document.getElementById('pdfBtn');
  if (btn) btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    // A4 portrait in mm: 210 × 297
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

    // Brand colors
    const RED = [225, 6, 0];
    const BLACK = [10, 10, 10];
    const TEXT = [40, 40, 40];
    const TEXT_DIM = [120, 120, 120];
    const LINE = [200, 200, 200];

    // Block type colors (for left bar)
    const BLOCK_COLORS = {
      warmup:   [74, 144, 226],
      strength: [200, 130, 0],
      wod:      RED,
      acc:      [100, 165, 30],
      cooldown: [120, 120, 120],
      notes:    [80, 80, 80]
    };
    const BLOCK_LABELS = {
      warmup: 'WARM-UP',
      strength: 'FUERZA',
      wod: 'WOD',
      acc: 'ACCESORIO',
      cooldown: 'COOLDOWN',
      notes: 'NOTAS COACH'
    };

    const pageW = 210;
    const pageH = 297;
    const margin = 14;
    const contentW = pageW - margin * 2;

    let y = margin;

    // ===== HEADER (cover page top) =====
    // Black band with brand
    doc.setFillColor(...BLACK);
    doc.rect(0, 0, pageW, 28, 'F');

    // V logo (simplified — solid red wings + white V)
    drawValhallaLogo(doc, margin, 6, 16);

    // Brand text
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('VALHALLA', margin + 22, 14);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(150, 150, 150);
    doc.text('BOX PROGRAMMING', margin + 22, 19);

    // Track name (right side of header)
    doc.setTextColor(...RED);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(track.name.toUpperCase(), pageW - margin, 14, { align: 'right' });
    doc.setTextColor(180, 180, 180);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    const weekNum = String(getISOWeek(currentWeekStart)).padStart(2, '0');
    const sun = addDays(currentWeekStart, 6);
    const range = `Semana ${weekNum} · ${fmtDay(currentWeekStart)} ${fmtMonShort(currentWeekStart)} → ${fmtDay(sun)} ${fmtMonShort(sun)}`;
    doc.text(range, pageW - margin, 19, { align: 'right' });

    y = 36;

    // Week title (if exists)
    if (week.title) {
      doc.setTextColor(...BLACK);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      const titleLines = doc.splitTextToSize(week.title, contentW);
      doc.text(titleLines, margin, y);
      y += titleLines.length * 6 + 4;
    }

    // Thin red rule
    doc.setDrawColor(...RED);
    doc.setLineWidth(0.6);
    doc.line(margin, y, pageW - margin, y);
    y += 6;

    // ===== DAYS =====
    for (let i = 0; i < 7; i++) {
      const dayInfo = DAYS[i];
      const day = week.days[dayInfo.code];
      const date = addDays(currentWeekStart, i);
      const dateStr = `${fmtDay(date)}/${String(date.getMonth() + 1).padStart(2, '0')}`;

      // Estimate height needed for this day
      let estimatedH = 14; // header del día
      if (day.rest) {
        estimatedH += 10;
      } else if (day.blocks.length === 0) {
        estimatedH += 8;
      } else {
        day.blocks.forEach(b => {
          estimatedH += 12; // header del bloque
          const bodyText = (b.title ? b.title + '\n' : '') + (b.body || '');
          const lines = doc.splitTextToSize(bodyText || '—', contentW - 14);
          estimatedH += lines.length * 4.2 + 6;
          if (b.type === 'wod' && (b.format || b.timeCap || b.score)) estimatedH += 6;
          if (b.type === 'wod' && b.stimulus) estimatedH += 8;
        });
      }

      // Page break if needed
      if (y + estimatedH > pageH - margin && i > 0) {
        addFooter(doc, pageW, pageH, margin, track.name, range);
        doc.addPage();
        y = margin + 6;
      }

      // ===== DAY HEADER =====
      doc.setFillColor(245, 245, 245);
      doc.rect(margin, y, contentW, 9, 'F');
      // Red strip on the left
      const isToday = isSameDate(date, new Date());
      if (isToday) {
        doc.setFillColor(...RED);
        doc.rect(margin, y, 1.5, 9, 'F');
      }
      doc.setTextColor(...BLACK);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      const dayLabel = dayInfo.code === 'mon' ? 'LUNES' :
                       dayInfo.code === 'tue' ? 'MARTES' :
                       dayInfo.code === 'wed' ? 'MIÉRCOLES' :
                       dayInfo.code === 'thu' ? 'JUEVES' :
                       dayInfo.code === 'fri' ? 'VIERNES' :
                       dayInfo.code === 'sat' ? 'SÁBADO' : 'DOMINGO';
      doc.text(dayLabel, margin + 4, y + 6);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(...TEXT_DIM);
      doc.text(dateStr, pageW - margin - 4, y + 6, { align: 'right' });

      // Focus
      if (day.focus && !day.rest) {
        doc.setTextColor(...TEXT_DIM);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'italic');
        const focusW = doc.getTextWidth(day.focus);
        doc.text(day.focus.toUpperCase(), pageW - margin - 18, y + 6, { align: 'right' });
      }
      y += 11;

      // ===== DAY BODY =====
      if (day.rest) {
        doc.setTextColor(...RED);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text('— DÍA DE DESCANSO —', pageW / 2, y + 4, { align: 'center' });
        y += 12;
      } else if (day.blocks.length === 0) {
        doc.setTextColor(...TEXT_DIM);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(8);
        doc.text('Sin bloques programados', margin + 4, y + 3);
        y += 8;
      } else {
        day.blocks.forEach(b => {
          // Page break check
          if (y + 30 > pageH - margin) {
            addFooter(doc, pageW, pageH, margin, track.name, range);
            doc.addPage();
            y = margin + 6;
          }

          const blockColor = BLOCK_COLORS[b.type] || [100, 100, 100];
          const startY = y;

          // Block tag bar
          doc.setFillColor(...blockColor);
          doc.rect(margin, y, 1.5, 0.1, 'F'); // Just a placeholder, drawn later with full height

          // Block label
          doc.setTextColor(...blockColor);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9);
          doc.text(BLOCK_LABELS[b.type] || b.type.toUpperCase(), margin + 4, y + 3.5);

          // WOD pills (format / time cap / score)
          if (b.type === 'wod') {
            let pillX = margin + 4 + doc.getTextWidth(BLOCK_LABELS.wod) + 4;
            if (b.format) {
              const w = doc.getTextWidth(b.format) + 4;
              doc.setFillColor(...RED);
              doc.roundedRect(pillX, y + 0.5, w, 4, 1, 1, 'F');
              doc.setTextColor(255, 255, 255);
              doc.setFont('helvetica', 'bold');
              doc.setFontSize(7);
              doc.text(b.format, pillX + 2, y + 3.3);
              pillX += w + 2;
            }
            if (b.timeCap) {
              const txt = `${b.timeCap}`;
              const w = doc.getTextWidth(txt) + 4;
              doc.setDrawColor(...LINE);
              doc.setFillColor(255, 255, 255);
              doc.roundedRect(pillX, y + 0.5, w, 4, 1, 1, 'FD');
              doc.setTextColor(...TEXT);
              doc.setFont('helvetica', 'normal');
              doc.setFontSize(7);
              doc.text(txt, pillX + 2, y + 3.3);
              pillX += w + 2;
            }
            if (b.score) {
              const txt = b.score;
              const w = doc.getTextWidth(txt) + 4;
              doc.setDrawColor(...LINE);
              doc.setFillColor(255, 255, 255);
              doc.roundedRect(pillX, y + 0.5, w, 4, 1, 1, 'FD');
              doc.setTextColor(...TEXT);
              doc.setFont('helvetica', 'normal');
              doc.setFontSize(7);
              doc.text(txt, pillX + 2, y + 3.3);
            }
          }

          y += 6;

          // Block title
          if (b.title) {
            doc.setTextColor(...BLACK);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            const titleLines = doc.splitTextToSize(b.title, contentW - 8);
            doc.text(titleLines, margin + 4, y + 3.5);
            y += titleLines.length * 4.5 + 1;
          }

          // Block body
          if (b.body) {
            doc.setTextColor(...TEXT);
            doc.setFont('courier', 'normal');
            doc.setFontSize(9);
            const bodyLines = doc.splitTextToSize(b.body, contentW - 8);
            // Page break inside long body
            for (let li = 0; li < bodyLines.length; li++) {
              if (y + 5 > pageH - margin) {
                // Draw left bar before page break
                doc.setFillColor(...blockColor);
                doc.rect(margin, startY, 1.5, y - startY, 'F');
                addFooter(doc, pageW, pageH, margin, track.name, range);
                doc.addPage();
                y = margin + 6;
                // Continue the block bar on new page
                const newStartY = y;
                doc.setFillColor(...blockColor);
                doc.rect(margin, newStartY, 1.5, 1, 'F'); // small starter
              }
              doc.text(bodyLines[li], margin + 4, y + 3.5);
              y += 4.2;
            }
            y += 1;
          }

          // WOD stimulus
          if (b.type === 'wod' && b.stimulus) {
            y += 1;
            doc.setFillColor(255, 240, 240);
            const stimW = contentW - 4;
            const stimLines = doc.splitTextToSize(`Estímulo: ${b.stimulus}`, stimW - 4);
            const stimH = stimLines.length * 4 + 3;
            doc.rect(margin + 4, y, stimW, stimH, 'F');
            doc.setTextColor(...RED);
            doc.setFont('helvetica', 'italic');
            doc.setFontSize(8);
            doc.text(stimLines, margin + 6, y + 3.5);
            y += stimH;
          }

          // Video link indicator
          if (b.video) {
            doc.setTextColor(74, 144, 226);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.text('▶ Video adjunto', margin + 4, y + 3);
            y += 4;
          }

          // Draw the colored left bar across the full block height
          doc.setFillColor(...blockColor);
          doc.rect(margin, startY, 1.5, y - startY, 'F');

          y += 4; // gap between blocks
        });
      }

      y += 3; // gap between days
    }

    addFooter(doc, pageW, pageH, margin, track.name, range);

    // Save
    const safeTrackName = track.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const filename = `valhalla-${safeTrackName}-sem${weekNum}.pdf`;
    doc.save(filename);
    showToast('PDF descargado');
  } catch (err) {
    console.error('PDF export error:', err);
    showToast('Error al generar PDF');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function addFooter(doc, pageW, pageH, margin, trackName, range) {
  const totalPages = doc.internal.getNumberOfPages();
  const currentPage = doc.internal.getCurrentPageInfo().pageNumber;
  doc.setDrawColor(220, 220, 220);
  doc.setLineWidth(0.2);
  doc.line(margin, pageH - 10, pageW - margin, pageH - 10);
  doc.setTextColor(150, 150, 150);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.text(`VALHALLA · ${trackName.toUpperCase()} · ${range}`, margin, pageH - 6);
  doc.text(`Pág. ${currentPage}`, pageW - margin, pageH - 6, { align: 'right' });
}

function drawValhallaLogo(doc, x, y, size) {
  // Logo simplificado para PDF: V negro con borde rojo + ala roja a cada lado
  const RED = [225, 6, 0];
  const cx = x + size / 2;

  // Wings: 3 stripes a cada lado
  doc.setFillColor(...RED);
  for (let i = 0; i < 3; i++) {
    const wY = y + size * 0.3 + i * (size * 0.13);
    const wH = size * 0.07;
    // Left wing stripe
    doc.rect(x, wY, size * 0.32, wH, 'F');
    // Right wing stripe
    doc.rect(x + size * 0.68, wY, size * 0.32, wH, 'F');
  }

  // V central — letra mayúscula
  doc.setFillColor(255, 255, 255);
  doc.rect(cx - size * 0.18, y + size * 0.18, size * 0.36, size * 0.64, 'F');
  doc.setTextColor(...RED);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(size * 1.3);
  doc.text('V', cx, y + size * 0.78, { align: 'center' });
}


function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function maybeShowSwipeHint() {
  if (!window.matchMedia('(max-width: 768px)').matches) return;
  if (sessionStorage.getItem('valhalla-swipe-hint-shown')) return;
  sessionStorage.setItem('valhalla-swipe-hint-shown', '1');
  setTimeout(() => {
    const hint = document.createElement('div');
    hint.className = 'swipe-hint';
    hint.textContent = '← Deslizá para cambiar de día →';
    document.body.appendChild(hint);
    setTimeout(() => hint.remove(), 4500);
  }, 800);
}

/* ============================================================
   INIT
   ============================================================ */
// Show login screen by default — auth.onAuthStateChanged will switch to app if user is logged in
document.getElementById('loginScreen').style.display = 'flex';

// Autofocus en username solo en desktop (en mobile, focusear abre el teclado y es molesto)
if (!window.matchMedia('(max-width: 768px)').matches) {
  setTimeout(() => {
    const u = document.getElementById('loginUser');
    if (u && document.getElementById('loginScreen').style.display !== 'none') u.focus();
  }, 100);
}

// Re-scroll to active day when window resizes (e.g. orientation change)
let resizeDebounce = null;
window.addEventListener('resize', () => {
  if (resizeDebounce) clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(() => {
    if (window.matchMedia('(max-width: 768px)').matches) {
      scrollToActiveDay(false);
    }
  }, 200);
});

// Mobile: manejar el teclado virtual con visualViewport API
// Cuando se abre el teclado, evitar que el viewport haga zoom raro
if (window.visualViewport && window.matchMedia('(max-width: 768px)').matches) {
  let lastHeight = window.visualViewport.height;
  window.visualViewport.addEventListener('resize', () => {
    const newHeight = window.visualViewport.height;
    const isKeyboardOpen = newHeight < lastHeight - 100;
    document.body.classList.toggle('keyboard-open', isKeyboardOpen);
    lastHeight = newHeight;
  });
}

// Mobile: haptic feedback al cambiar de día (si el dispositivo lo soporta)
function hapticTap() {
  if (window.matchMedia('(max-width: 768px)').matches && navigator.vibrate) {
    try { navigator.vibrate(10); } catch(e) {}
  }
}
