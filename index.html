<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALHALLA — Programación Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-elev-2: #1a1a1a;
    --bg-card: #1f1f1f;
    --line: #2a2a2a;
    --line-strong: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #999;
    --text-faint: #666;
    --red: #e10600;
    --red-bright: #ff1a1a;
    --red-dark: #a50400;
    --red-glow: rgba(225, 6, 0, 0.15);
    --warmup: #4a90e2;
    --strength: #f5a623;
    --wod: var(--red);
    --acc: #7ed321;
    --cooldown: #9b9b9b;
    --notes: #b8b8b8;
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(at 0% 0%, rgba(225,6,0,0.04) 0%, transparent 50%),
      radial-gradient(at 100% 100%, rgba(225,6,0,0.03) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ========== LOGIN SCREEN ========== */
  .login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    background-image:
      radial-gradient(at 50% 30%, rgba(225,6,0,0.18) 0%, transparent 55%),
      radial-gradient(at 20% 80%, rgba(225,6,0,0.08) 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 24px;
  }
  .login-box {
    width: 100%;
    max-width: 380px;
    background: rgba(20,20,20,0.85);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    padding: 36px 32px 28px;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .login-logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 14px;
    display: block;
  }
  .login-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 0.18em;
    color: var(--text);
    margin-bottom: 4px;
  }
  .login-title span { color: var(--red); }
  .login-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 28px;
  }
  .login-field { margin-bottom: 12px; text-align: left; }
  .login-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 5px;
  }
  .login-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 13px;
    font-size: 14px;
    border-radius: 6px;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s;
  }
  .login-field input:focus { border-color: var(--red); }
  .login-error {
    color: var(--red-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    min-height: 14px;
    text-align: center;
  }
  .login-btn {
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    padding: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.16em;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 8px;
  }
  .login-btn:hover { background: var(--red-bright); transform: translateY(-1px); }
  .login-foot {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .app { display: none; }
  .app.authed { display: block; }

  /* ========== HEADER ========== */
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 42px; height: 42px; flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1; }
  .brand-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.12em;
    color: var(--text);
  }
  .brand-name span { color: var(--red); }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-top: 3px;
  }

  .header-center {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
  }
  .week-nav-btn {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .week-nav-btn:hover { border-color: var(--red); color: var(--red); }
  .week-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 240px;
    padding: 4px 14px;
  }
  .week-display .week-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .week-display .week-num span { color: var(--red); }
  .week-display .week-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 2px;
  }
  .today-btn {
    background: var(--red);
    color: #fff;
    border: 1px solid var(--red);
    padding: 7px 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 8px;
  }
  .today-btn:hover { background: var(--red-bright); border-color: var(--red-bright); }

  .header-actions { display: flex; gap: 6px; align-items: center; }
  .header-btn {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .header-btn:hover { border-color: var(--text-faint); }
  .header-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .header-btn.primary:hover { background: var(--red-bright); border-color: var(--red-bright); }
  .role-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    padding: 4px 9px;
    border-radius: 3px;
    background: var(--red);
    color: #fff;
  }
  .role-badge.viewer { background: var(--bg-elev-2); color: var(--text-dim); border: 1px solid var(--line); }

  /* ========== CALENDAR GRID ========== */
  .calendar { padding: 16px 16px 60px; }

  .week-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 8px 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .week-title-row .ed-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.04em;
    background: transparent;
    border: none;
    color: var(--text);
    outline: none;
    flex: 1;
    min-width: 200px;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .week-title-row .ed-title:focus { background: var(--bg-elev); }
  .week-title-row .ed-title:read-only { cursor: default; }
  .week-title-row .ed-title:read-only:focus { background: transparent; }
  .week-stats {
    display: flex;
    gap: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .week-stats b { color: var(--red); font-weight: 700; font-size: 13px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(200px, 1fr));
    gap: 8px;
    align-items: start;
  }

  .day-col {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: visible;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s;
  }
  .day-col:hover { border-color: var(--line-strong); }
  .day-col.is-today { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 24px var(--red-glow); }
  .day-col.is-rest { background: linear-gradient(180deg, var(--bg-elev) 0%, rgba(255,255,255,0.02) 100%); }

  .day-head {
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev-2);
    border-radius: 8px 8px 0 0;
    position: sticky;
    top: 70px;
    z-index: 10;
  }
  .day-col.is-today .day-head { background: linear-gradient(180deg, rgba(225,6,0,0.18), var(--bg-elev-2)); }
  .day-head-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .day-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  .day-col.is-today .day-name { color: var(--red); }
  .day-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 700;
  }
  .day-focus-input {
    background: transparent;
    border: 1px dashed transparent;
    color: var(--text-dim);
    font-size: 11px;
    width: 100%;
    padding: 3px 4px;
    margin-top: 4px;
    border-radius: 3px;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .day-focus-input::placeholder { color: var(--text-faint); font-style: italic; }
  .day-focus-input:not(:read-only):hover { border-color: var(--line); }
  .day-focus-input:not(:read-only):focus { background: var(--bg); border-color: var(--red); border-style: solid; color: var(--text); }

  .day-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    gap: 6px;
  }
  .rest-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    user-select: none;
  }
  .rest-toggle input { accent-color: var(--red); width: 12px; height: 12px; }
  .day-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
  }

  .day-body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .day-col.is-rest .day-body { opacity: 0.55; }

  .rest-banner {
    text-align: center;
    padding: 32px 12px;
    color: var(--text-dim);
  }
  .rest-banner .display {
    font-size: 32px;
    color: var(--text);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .rest-banner small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  /* ========== BLOCK CARDS (preview only — click opens modal) ========== */
  .block {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--text-faint);
    border-radius: 5px;
    overflow: hidden;
    transition: all 0.15s;
    cursor: pointer;
  }
  .block:hover {
    border-color: var(--line-strong);
    background: var(--bg-elev-2);
    transform: translateX(1px);
  }
  .block.b-warmup { border-left-color: var(--warmup); }
  .block.b-strength { border-left-color: var(--strength); }
  .block.b-wod { border-left-color: var(--wod); }
  .block.b-acc { border-left-color: var(--acc); }
  .block.b-cooldown { border-left-color: var(--cooldown); }
  .block.b-notes { border-left-color: var(--notes); }

  .block-preview {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .block-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .block-tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .block-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .b-warmup .block-tag { color: var(--warmup); }
  .b-warmup .block-tag::before { background: var(--warmup); }
  .b-strength .block-tag { color: var(--strength); }
  .b-strength .block-tag::before { background: var(--strength); }
  .b-wod .block-tag { color: var(--red); }
  .b-wod .block-tag::before { background: var(--red); }
  .b-acc .block-tag { color: var(--acc); }
  .b-acc .block-tag::before { background: var(--acc); }
  .b-cooldown .block-tag { color: var(--cooldown); }
  .b-cooldown .block-tag::before { background: var(--cooldown); }
  .b-notes .block-tag { color: var(--notes); }
  .b-notes .block-tag::before { background: var(--notes); }

  .block-chevron {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    transition: color 0.15s;
  }
  .block:hover .block-chevron { color: var(--red); }

  .block-preview-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--text);
    line-height: 1.2;
  }
  .block-preview-snippet {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    margin-top: 2px;
  }
  .block-wod-meta {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .block-wod-pill {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 1px 6px;
    border-radius: 2px;
    background: var(--red);
    color: #fff;
  }
  .block-wod-pill.cap {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0;
  }
  .block-video-indicator {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--warmup);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* ========== ADD BLOCK ========== */
  .add-block-wrap { position: relative; margin-top: 4px; }
  .add-block-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line-strong);
    color: var(--text-dim);
    padding: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .add-block-btn:hover { border-color: var(--red); color: var(--red); background: rgba(225,6,0,0.04); }

  .add-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    z-index: 50;
    overflow: hidden;
    display: none;
  }
  .add-menu.open { display: block; }
  .add-menu-item {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 9px 12px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }
  .add-menu-item:hover { background: var(--bg-card); }
  .add-menu-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ========== MODAL (block detail — BIG) ========== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(8px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 200;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .modal-bg.open { display: flex; }

  /* Block detail modal — large, scrollable */
  .modal-detail {
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    width: 100%;
    max-width: 720px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    border-left: 5px solid var(--text-faint);
    margin: auto;
  }
  .modal-detail.b-warmup { border-left-color: var(--warmup); }
  .modal-detail.b-strength { border-left-color: var(--strength); }
  .modal-detail.b-wod { border-left-color: var(--red); }
  .modal-detail.b-acc { border-left-color: var(--acc); }
  .modal-detail.b-cooldown { border-left-color: var(--cooldown); }
  .modal-detail.b-notes { border-left-color: var(--notes); }

  .modal-detail-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .modal-detail-tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.18em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .modal-detail-tag::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .modal-detail.b-warmup .modal-detail-tag { color: var(--warmup); }
  .modal-detail.b-warmup .modal-detail-tag::before { background: var(--warmup); }
  .modal-detail.b-strength .modal-detail-tag { color: var(--strength); }
  .modal-detail.b-strength .modal-detail-tag::before { background: var(--strength); }
  .modal-detail.b-wod .modal-detail-tag { color: var(--red); }
  .modal-detail.b-wod .modal-detail-tag::before { background: var(--red); }
  .modal-detail.b-acc .modal-detail-tag { color: var(--acc); }
  .modal-detail.b-acc .modal-detail-tag::before { background: var(--acc); }
  .modal-detail.b-cooldown .modal-detail-tag { color: var(--cooldown); }
  .modal-detail.b-cooldown .modal-detail-tag::before { background: var(--cooldown); }
  .modal-detail.b-notes .modal-detail-tag { color: var(--notes); }
  .modal-detail.b-notes .modal-detail-tag::before { background: var(--notes); }

  .modal-detail-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .modal-detail-actions { display: flex; gap: 6px; }
  .modal-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 5px;
    cursor: pointer;

<script>
/* ============================================================
   VALHALLA — v3 with detail modal + scrollable day columns
   ============================================================ */

const USERS = {
  'admin':  { pass: 'richfroning', role: 'admin' },
  'profes': { pass: 'valhalla',    role: 'viewer' }
};

const SESSION_KEY = 'valhalla-session-v1';
const STORAGE_KEY = 'valhalla-programming-v2';

const DAYS = [
  { code: 'mon', short: 'LUN', long: 'LUNES' },
  { code: 'tue', short: 'MAR', long: 'MARTES' },
  { code: 'wed', short: 'MIÉ', long: 'MIÉRCOLES' },
  { code: 'thu', short: 'JUE', long: 'JUEVES' },
  { code: 'fri', short: 'VIE', long: 'VIERNES' },
  { code: 'sat', short: 'SÁB', long: 'SÁBADO' },
  { code: 'sun', short: 'DOM', long: 'DOMINGO' },
];

const WOD_FORMATS = ['AMRAP','For Time','EMOM','E2MOM','E3MOM','Tabata','For Quality','Chipper','RFT','Intervals','Death by','Ladder','Other'];

const BLOCK_TYPES = {
  warmup:   { tag: 'WARM-UP',     class: 'b-warmup',
              placeholder: 'ej.\n3 rondas:\n10 cal row\n10 air squats\n10 push-ups\n10 PVC pass-through' },
  strength: { tag: 'FUERZA',      class: 'b-strength',
              placeholder: 'ej.\n1 Clean Deadlift a mitad de muslo + 1 Power Clean + 1 Push Jerk @70% 1RM C&J\n1 Clean Deadlift a mitad de muslo + 1 Power Clean + 1 Push Jerk @75% 1RM C&J\n1 Clean Deadlift a mitad de muslo + 1 Power Clean + 1 Push Jerk @80% 1RM C&J' },
  wod:      { tag: 'WOD',         class: 'b-wod',
              placeholder: 'ej.\n21-15-9 reps for time:\nThrusters @ 43kg\nPull-ups' },
  acc:      { tag: 'ACCESORIO',   class: 'b-acc',
              placeholder: 'ej.\n3 rondas:\n10 GHD sit-ups\n12 DB walking lunges (2x22.5kg)\n15 banded face pulls' },
  cooldown: { tag: 'COOLDOWN',    class: 'b-cooldown',
              placeholder: 'ej.\nPigeon stretch 1 min/lado\nChild pose 1 min\nFoam roll cuádriceps 2 min' },
  notes:    { tag: 'NOTAS COACH', class: 'b-notes',
              placeholder: 'Notas para el profesor: scaling, focos técnicos, observaciones...' },
};

let currentWeekStart = mondayOf(new Date());
let allWeeks = {};
let currentRole = null;
let currentUser = null;
let openBlockTarget = null; // { dayCode, blockId }

/* ============================================================
   AUTH
   ============================================================ */
function doLogin(e) {
  if (e) e.preventDefault();
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');

  if (USERS[u] && USERS[u].pass === p) {
    currentUser = u;
    currentRole = USERS[u].role;
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ user: u, role: currentRole }));
    showApp();
  } else {
    errEl.textContent = 'Usuario o contraseña incorrectos';
    document.getElementById('loginPass').value = '';
    setTimeout(() => { errEl.textContent = ''; }, 3000);
  }
  return false;
}

function doLogout() {
  if (currentRole === 'admin') {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allWeeks)); } catch(e) {}
  }
  sessionStorage.removeItem(SESSION_KEY);
  currentRole = null;
  currentUser = null;
  document.getElementById('app').classList.remove('authed');
  document.getElementById('app').classList.remove('role-viewer');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginUser').focus();
}

function tryRestoreSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s && USERS[s.user] && s.role === USERS[s.user].role) {
      currentUser = s.user;
      currentRole = s.role;
      showApp();
      return true;
    }
  } catch(e) {}
  return false;
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  const app = document.getElementById('app');
  app.classList.add('authed');
  app.classList.toggle('role-viewer', currentRole === 'viewer');

  const badge = document.getElementById('roleBadge');
  if (currentRole === 'admin') {
    badge.textContent = 'ADMIN';
    badge.className = 'role-badge';
  } else {
    badge.textContent = 'PROFE · VISTA';
    badge.className = 'role-badge viewer';
  }
  document.getElementById('saveBtn').style.display = currentRole === 'admin' ? '' : 'none';

  loadLocal();
  render();
}

/* ============================================================
   DATE UTILS
   ============================================================ */
function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function isoKey(d) { return d.toISOString().slice(0,10); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDay(d) { return d.getDate().toString().padStart(2,'0'); }
function fmtMonShort(d) { return d.toLocaleDateString('es-AR', { month: 'short' }).toUpperCase().replace('.',''); }
function isSameDate(a,b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart)/86400000) + 1)/7);
}

/* ============================================================
   STATE
   ============================================================ */
function emptyDay() { return { rest: false, focus: '', blocks: [] }; }
function emptyWeek() {
  const w = { title: '', days: {} };
  DAYS.forEach(d => w.days[d.code] = emptyDay());
  return w;
}
function getWeek() {
  const key = isoKey(currentWeekStart);
  if (!allWeeks[key]) allWeeks[key] = emptyWeek();
  DAYS.forEach(d => { if (!allWeeks[key].days[d.code]) allWeeks[key].days[d.code] = emptyDay(); });
  return allWeeks[key];
}
function newBlock(type) {
  return {
    id: 'b'+Date.now()+Math.random().toString(36).slice(2,6),
    type, title: '', body: '',
    video: '', videoLabel: '',
    format: type === 'wod' ? 'AMRAP' : '',
    timeCap: '', score: '', stimulus: ''
  };
}

const isAdmin = () => currentRole === 'admin';
const ro = () => isAdmin() ? '' : 'readonly';

/* ============================================================
   RENDER GRID (calendar — preview cards only)
   ============================================================ */
function render() {
  const grid = document.getElementById('grid');
  const week = getWeek();
  const today = new Date();

  document.getElementById('weekNum').textContent = String(getISOWeek(currentWeekStart)).padStart(2,'0');
  const sun = addDays(currentWeekStart, 6);
  document.getElementById('weekRange').textContent =
    `${fmtDay(currentWeekStart)} ${fmtMonShort(currentWeekStart)} → ${fmtDay(sun)} ${fmtMonShort(sun)}`;
  const titleEl = document.getElementById('weekTitle');
  titleEl.value = week.title || '';
  titleEl.readOnly = !isAdmin();

  grid.innerHTML = '';
  let stats = { sessions: 0, wods: 0, lifts: 0 };

  DAYS.forEach((d, idx) => {
    const date = addDays(currentWeekStart, idx);
    const day = week.days[d.code];
    const isToday = isSameDate(date, today);
    if (!day.rest) stats.sessions++;
    day.blocks.forEach(b => {
      if (b.type === 'wod') stats.wods++;
      if (b.type === 'strength') stats.lifts++;
    });

    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' is-today' : '') + (day.rest ? ' is-rest' : '');
    col.innerHTML = renderDay(d, day, date);
    grid.appendChild(col);
  });

  document.getElementById('statSessions').textContent = `${stats.sessions}/7`;
  document.getElementById('statWods').textContent = stats.wods;
  document.getElementById('statLifts').textContent = stats.lifts;
}

function renderDay(d, day, date) {
  const restCheckbox = isAdmin()
    ? `<label class="rest-toggle">
         <input type="checkbox" ${day.rest?'checked':''} onchange="toggleRest('${d.code}',this.checked)">
         DESCANSO
       </label>`
    : (day.rest ? `<span class="day-meta" style="color: var(--red);">DESCANSO</span>` : '');

  return `
    <div class="day-head">
      <div class="day-head-top">
        <div class="day-name">${d.short}</div>
        <div class="day-date">${fmtDay(date)}/${String(date.getMonth()+1).padStart(2,'0')}</div>
      </div>
      <input class="day-focus-input" type="text" placeholder="foco del día"
        value="${esc(day.focus)}" ${ro()}
        onchange="updateField('${d.code}','focus',this.value); render();">
      <div class="day-actions">
        ${restCheckbox}
        ${day.rest ? '' : `<span class="day-meta">${day.blocks.length} bloque${day.blocks.length === 1 ? '' : 's'}</span>`}
      </div>
    </div>
    <div class="day-body">
      ${day.rest ? `
        <div class="rest-banner">
          <div class="display">REST</div>
          <small>recuperación · movilidad</small>
        </div>
      ` : `
        ${day.blocks.map(b => renderBlockPreview(d.code, b)).join('')}
        ${isAdmin() ? `
          <div class="add-block-wrap">
            <button class="add-block-btn" onclick="toggleAddMenu(event, '${d.code}')">+ AÑADIR BLOQUE</button>
            <div class="add-menu" id="addMenu-${d.code}">
              <button class="add-menu-item" onclick="addBlock('${d.code}','warmup')"><span class="dot" style="background:#4a90e2"></span>Calentamiento</button>
              <button class="add-menu-item" onclick="addBlock('${d.code}','strength')"><span class="dot" style="background:#f5a623"></span>Fuerza / Lift</button>
              <button class="add-menu-item" onclick="addBlock('${d.code}','wod')"><span class="dot" style="background:#e10600"></span>WOD</button>
              <button class="add-menu-item" onclick="addBlock('${d.code}','acc')"><span class="dot" style="background:#7ed321"></span>Accesorio</button>
              <button class="add-menu-item" onclick="addBlock('${d.code}','cooldown')"><span class="dot" style="background:#9b9b9b"></span>Cool-down</button>
              <button class="add-menu-item" onclick="addBlock('${d.code}','notes')"><span class="dot" style="background:#b8b8b8"></span>Notas del Coach</button>
            </div>
          </div>
        ` : ''}
      `}
    </div>
  `;
}

/* Preview card (calendar) — compact, click opens modal */
function renderBlockPreview(dayCode, b) {
  const meta = BLOCK_TYPES[b.type];
  const snippet = b.body ? b.body.split('\n').slice(0, 3).join('\n') : '';

  let preview = '';
  if (b.title) {
    preview += `<div class="block-preview-title">${esc(b.title)}</div>`;
  }
  if (b.type === 'wod') {
    const pills = [];
    if (b.format) pills.push(`<span class="block-wod-pill">${esc(b.format)}</span>`);
    if (b.timeCap) pills.push(`<span class="block-wod-pill cap">${esc(b.timeCap)}</span>`);
    if (pills.length) preview += `<div class="block-wod-meta">${pills.join('')}</div>`;
  }
  if (snippet) {
    preview += `<div class="block-preview-snippet">${esc(snippet)}</div>`;
  } else if (!b.title) {
    preview += `<div class="block-preview-snippet" style="color:var(--text-faint); font-style:italic;">— vacío —</div>`;
  }
  if (b.video) {
    preview += `<div class="block-video-indicator">▶ Video adjunto</div>`;
  }

  return `
    <div class="block ${meta.class}" onclick="openBlockModal('${dayCode}','${b.id}')">
      <div class="block-preview">
        <div class="block-preview-head">
          <span class="block-tag">${meta.tag}</span>
          <span class="block-chevron">▸</span>
        </div>
        ${preview}
      </div>
    </div>
  `;
}

/* ============================================================
   BLOCK DETAIL MODAL (large, scrollable, legible)
   ============================================================ */
function openBlockModal(dayCode, blockId) {
  const b = getWeek().days[dayCode].blocks.find(b => b.id === blockId);
  if (!b) return;
  openBlockTarget = { dayCode, blockId };
  renderBlockModal();
  document.getElementById('blockModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeBlockModal() {
  document.getElementById('blockModal').classList.remove('open');
  document.body.style.overflow = '';
  openBlockTarget = null;
  // Re-render so previews reflect any changes
  render();
}

function renderBlockModal() {
  if (!openBlockTarget) return;
  const { dayCode, blockId } = openBlockTarget;
  const b = getWeek().days[dayCode].blocks.find(b => b.id === blockId);
  if (!b) { closeBlockModal(); return; }

  const meta = BLOCK_TYPES[b.type];
  const dayObj = DAYS.find(d => d.code === dayCode);
  const dayIdx = DAYS.findIndex(d => d.code === dayCode);
  const date = addDays(currentWeekStart, dayIdx);
  const dateStr = `${fmtDay(date)}/${String(date.getMonth()+1).padStart(2,'0')}`;

  const titlePlaceholder = b.type === 'wod' ? 'Nombre del WOD (opcional)'
                         : b.type === 'strength' ? 'Movimiento principal (opcional)'
                         : 'Título (opcional)';

  // WOD format dropdown / display
  let wodMetaHtml = '';
  if (b.type === 'wod') {
    if (isAdmin()) {
      wodMetaHtml = `
        <div class="modal-wod-row">
          <div>
            <label>Formato</label>
            <select onchange="updateOpenBlock('format', this.value)">
              ${WOD_FORMATS.map(f => `<option ${b.format===f?'selected':''}>${f}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Time Cap</label>
            <input type="text" placeholder="ej. 12:00" value="${esc(b.timeCap)}"
              oninput="updateOpenBlock('timeCap', this.value)">
          </div>
          <div>
            <label>Tipo de Score</label>
            <input type="text" placeholder="Reps / Time / Load" value="${esc(b.score)}"
              oninput="updateOpenBlock('score', this.value)">
          </div>
        </div>
      `;
    } else {
      wodMetaHtml = `
        <div class="modal-wod-row">
          <div>
            <label>Formato</label>
            <select disabled><option>${esc(b.format || '—')}</option></select>
          </div>
          <div>
            <label>Time Cap</label>
            <input type="text" value="${esc(b.timeCap || '—')}" readonly>
          </div>
          <div>
            <label>Tipo de Score</label>
            <input type="text" value="${esc(b.score || '—')}" readonly>
          </div>
        </div>
      `;
    }
  }

  // Title
  let titleHtml = '';
  if (isAdmin()) {
    titleHtml = `
      <div class="field-group">
        <span class="field-label">Título</span>
        <input class="modal-title-input" placeholder="${titlePlaceholder}"
          value="${esc(b.title)}" oninput="updateOpenBlock('title', this.value)">
      </div>
    `;
  } else if (b.title) {
    titleHtml = `
      <div class="field-group">
        <span class="field-label">Título</span>
        <div class="modal-title-display">${esc(b.title)}</div>
      </div>
    `;
  }

  // Body
  let bodyHtml = '';
  if (isAdmin()) {
    bodyHtml = `
      <div class="field-group">
        <span class="field-label">Detalle del bloque</span>
        <textarea class="modal-body-textarea" placeholder="${esc(meta.placeholder)}"
          oninput="updateOpenBlock('body', this.value)">${esc(b.body)}</textarea>
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="field-group">
        <span class="field-label">Detalle del bloque</span>
        <div class="modal-body-display ${b.body ? '' : 'empty'}">${b.body ? esc(b.body) : '— sin contenido —'}</div>
      </div>
    `;
  }

  // Stimulus (WOD only)
  let stimulusHtml = '';
  if (b.type === 'wod') {
    if (isAdmin()) {
      stimulusHtml = `
        <div class="field-group">
          <span class="field-label">Estímulo objetivo</span>
          <input class="modal-stimulus-input" placeholder="ej. sprint, ritmo de empujar fuerte"
            value="${esc(b.stimulus)}" oninput="updateOpenBlock('stimulus', this.value)">
        </div>
      `;
    } else if (b.stimulus) {
      stimulusHtml = `
        <div class="field-group">
          <span class="field-label">Estímulo objetivo</span>
          <div class="modal-body-display" style="font-style: italic; min-height: auto; color: var(--text); background: rgba(225,6,0,0.05); border-color: rgba(225,6,0,0.25);">${esc(b.stimulus)}</div>
        </div>
      `;
    }
  }

  // Video
  let videoHtml = '';
  if (isAdmin()) {
    videoHtml = `
      <div class="field-group">
        <span class="field-label">Video</span>
        <div class="modal-video-row">
          <div class="vid-info">
            ${b.video
              ? `▶ <a href="${esc(b.video)}" target="_blank" rel="noopener">${esc(b.videoLabel || b.video)}</a>`
              : `<span class="empty">Sin video adjunto</span>`}
          </div>
          <button class="header-btn" onclick="openVideoModal()">${b.video ? 'Editar' : '+ Añadir'}</button>
          ${b.video ? `<button class="header-btn" onclick="removeVideoLink()">Quitar</button>` : ''}
        </div>
      </div>
    `;
  } else if (b.video) {
    videoHtml = `
      <div class="field-group">
        <span class="field-label">Video</span>
        <div class="modal-video-row">
          <div class="vid-info">
            ▶ <a href="${esc(b.video)}" target="_blank" rel="noopener">${esc(b.videoLabel || b.video)}</a>
          </div>
        </div>
      </div>
    `;
  }

  const footer = isAdmin() ? `
    <div class="modal-detail-foot">
      <button class="danger-btn" onclick="deleteOpenBlock()">🗑 Eliminar bloque</button>
      <button class="header-btn primary" onclick="closeBlockModal()">✓ Listo</button>
    </div>
  ` : `
    <div class="modal-detail-foot" style="justify-content: flex-end;">
      <button class="header-btn primary" onclick="closeBlockModal()">Cerrar</button>
    </div>
  `;

  document.getElementById('blockModalContent').className = 'modal-detail ' + meta.class;
  document.getElementById('blockModalContent').innerHTML = `
    <div class="modal-detail-head">
      <span class="modal-detail-tag">${meta.tag}</span>
      <span class="modal-detail-day">${dayObj.long} · ${dateStr}</span>
      <div class="modal-detail-actions">
        <button class="modal-close" onclick="closeBlockModal()">✕</button>
      </div>
    </div>
    <div class="modal-detail-body">
      ${titleHtml}
      ${wodMetaHtml}
      ${bodyHtml}
      ${stimulusHtml}
      ${videoHtml}
    </div>
    ${footer}
  `;
}

function updateOpenBlock(field, value) {
  if (!isAdmin() || !openBlockTarget) return;
  const b = getWeek().days[openBlockTarget.dayCode].blocks.find(b => b.id === openBlockTarget.blockId);
  if (b) b[field] = value;
}

function deleteOpenBlock() {
  if (!isAdmin() || !openBlockTarget) return;
  if (!confirm('¿Eliminar este bloque? Esta acción no se puede deshacer.')) return;
  const day = getWeek().days[openBlockTarget.dayCode];
  day.blocks = day.blocks.filter(b => b.id !== openBlockTarget.blockId);
  closeBlockModal();
}

function handleBackdropClick(e) {
  if (e.target.classList && e.target.classList.contains('modal-bg')) {
    if (e.target.id === 'blockModal') closeBlockModal();
    else if (e.target.id === 'videoModal') closeVideoModal();
  }
}

// ESC closes modals
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('videoModal').classList.contains('open')) {
      closeVideoModal();
    } else if (document.getElementById('blockModal').classList.contains('open')) {
      closeBlockModal();
    }
  }
});

/* ============================================================
   STATE MUTATIONS
   ============================================================ */
function guardAdmin() {
  if (!isAdmin()) { showToast('Solo lectura'); return false; }
  return true;
}
function toggleRest(code, val) {
  if (!guardAdmin()) return;
  getWeek().days[code].rest = val;
  render();
}
function updateField(code, field, value) {
  if (!isAdmin()) return;
  getWeek().days[code][field] = value;
}
function addBlock(code, type) {
  if (!guardAdmin()) return;
  const block = newBlock(type);
  getWeek().days[code].blocks.push(block);
  closeAllMenus();
  render();
  // Open the new block immediately for editing
  openBlockModal(code, block.id);
}

/* ============================================================
   ADD-BLOCK MENU
   ============================================================ */
function toggleAddMenu(ev, code) {
  ev.stopPropagation();
  const menu = document.getElementById('addMenu-' + code);
  if (!menu) return;
  const isOpen = menu.classList.contains('open');
  closeAllMenus();
  if (!isOpen) menu.classList.add('open');
}
function closeAllMenus() {
  document.querySelectorAll('.add-menu.open').forEach(m => m.classList.remove('open'));
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.add-block-wrap')) closeAllMenus();
});

/* ============================================================
   VIDEO MODAL
   ============================================================ */
function openVideoModal() {
  if (!isAdmin() || !openBlockTarget) return;
  const b = getWeek().days[openBlockTarget.dayCode].blocks.find(b => b.id === openBlockTarget.blockId);
  if (!b) return;
  document.getElementById('videoUrl').value = b.video || '';
  document.getElementById('videoLabel').value = b.videoLabel || '';
  document.getElementById('videoModal').classList.add('open');
}
function closeVideoModal() {
  document.getElementById('videoModal').classList.remove('open');
}
function saveVideoLink() {
  if (!isAdmin() || !openBlockTarget) return;
  const b = getWeek().days[openBlockTarget.dayCode].blocks.find(b => b.id === openBlockTarget.blockId);
  if (b) {
    b.video = document.getElementById('videoUrl').value.trim();
    b.videoLabel = document.getElementById('videoLabel').value.trim();
  }
  closeVideoModal();
  renderBlockModal();
  showToast('Video guardado');
}
function removeVideoLink() {
  if (!isAdmin() || !openBlockTarget) return;
  if (!confirm('¿Quitar el enlace de video?')) return;
  const b = getWeek().days[openBlockTarget.dayCode].blocks.find(b => b.id === openBlockTarget.blockId);
  if (b) { b.video = ''; b.videoLabel = ''; }
  renderBlockModal();
}

/* ============================================================
   WEEK NAV
   ============================================================ */
function navWeek(delta) {
  if (isAdmin()) getWeek().title = document.getElementById('weekTitle').value;
  currentWeekStart = addDays(currentWeekStart, delta * 7);
  render();
}
function goToToday() {
  if (isAdmin()) getWeek().title = document.getElementById('weekTitle').value;
  currentWeekStart = mondayOf(new Date());
  render();
}
document.getElementById('weekTitle').addEventListener('change', e => {
  if (!isAdmin()) return;
  getWeek().title = e.target.value;
});

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveLocal() {
  if (!isAdmin()) { showToast('Solo lectura'); return; }
  getWeek().title = document.getElementById('weekTitle').value;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allWeeks));
    showToast('Guardado');
  } catch(e) { showToast('Error al guardar'); }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) allWeeks = JSON.parse(raw);
  } catch(e) { console.warn('Load failed', e); }
}
setInterval(() => {
  if (!isAdmin()) return;
  try {
    getWeek().title = document.getElementById('weekTitle').value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allWeeks));
  } catch(e) {}
}, 20000);

window.addEventListener('beforeunload', () => {
  if (isAdmin()) {
    try {
      getWeek().title = document.getElementById('weekTitle').value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allWeeks));
    } catch(e) {}
  }
});

/* ============================================================
   UTILS
   ============================================================ */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============================================================
   INIT
   ============================================================ */
if (!tryRestoreSession()) {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').focus();
}

document.getElementById('loginPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin(e);
});
</script>
</body>
</html>
